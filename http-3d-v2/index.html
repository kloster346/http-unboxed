<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTTP 请求 · 3D 沉浸式教学</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0f1e; font-family: system-ui, sans-serif; color: #e6f0ff; }
    #root { width: 100%; height: 100%; }
    canvas { display: block; }
    .overlay { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
    .overlay > * { pointer-events: auto; }
    .hud-top { position: absolute; top: 16px; right: 16px; }
    .boss { display: flex; gap: 8px; align-items: center; background: rgba(20, 32, 64, 0.6); padding: 8px 12px; border-radius: 8px; border: 1px solid rgba(0, 191, 255, 0.4); cursor: pointer; }
    .hud-bottom { position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 16px; pointer-events: none; }
    .hud-progress { font-size: 14px; color: #7fa8ff; background: rgba(20, 32, 64, 0.5); padding: 4px 10px; border-radius: 6px; }
    .hud-caption { font-size: 22px; font-weight: 600; text-shadow: 0 0 12px rgba(0, 191, 255, 0.6); text-align: center; }
    .hud-controls { display: flex; gap: 8px; }
    .ctrl { pointer-events: auto; background: rgba(20, 32, 64, 0.7); color: #e6f0ff; border: 1px solid rgba(0, 191, 255, 0.5); border-radius: 8px; padding: 8px 14px; cursor: pointer; }
    .ctrl:hover { background: rgba(0, 90, 143, 0.7); }
    .ctrl:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
